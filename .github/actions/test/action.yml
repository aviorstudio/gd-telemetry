name: Test
description: 'Is this commit good. Nothing is packaged for release here and nothing
  is published; a failure means the addon is wrong, not that the pipeline is.

  A composite action rather than a reusable workflow so it runs in the caller''s job,
  under the caller''s name -- CI / Test, Release / Test -- rather than as a nested
  "caller / callee" check.

  ONE definition, called by CI and by Release both. Release did not run any of this
  before: it read the version, packaged the addon and published it, so the only thing
  between a broken commit and the registry was whether somebody looked at CI first.

  A per-repo copy, not a shared action. `uses: ./` is repo-local, so the fourteen
  copies of this file are copies -- the accepted cost of no repo''s CI breaking because
  another repo changed.

  '
runs:
  using: composite
  steps:
  - name: Validate addon package
    shell: bash
    run: make build
  - uses: ./.github/actions/setup-godot
    with:
      godot-version: 4.7.2
      godot-sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  - name: Godot tests
    shell: bash
    run: make test
  - name: Packaged addon install and editor lifecycle
    shell: bash
    run: make artifact-smoke
