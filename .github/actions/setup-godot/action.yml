name: "Set up Godot"
description: Install caller-pinned Godot through the released verified installer
inputs:
  godot-version:
    description: Reviewed stable Godot version
    required: true
  godot-sha256:
    description: Reviewed Linux x86_64 archive SHA256
    required: true
  install-templates:
    description: Whether to install export templates
    default: 'false'
  templates-checksum:
    description: Reviewed templates checksum, required when templates are requested
    default: ''
runs:
  using: composite
  steps:
    - name: "Set up Godot"
      uses: nicodes/tools/godot-setup@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
      with:
        version: ${{ inputs.godot-version }}
        binary-checksum: sha256:${{ inputs.godot-sha256 }}
        expected-version: ${{ inputs.godot-version }}.stable.official.ed1daf0bf
        install-templates: ${{ inputs.install-templates }}
        templates-checksum: ${{ inputs.templates-checksum }}
