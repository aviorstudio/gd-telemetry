name: Dependency Policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '1 6 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
concurrency:
  group: dependency-policy
  cancel-in-progress: false
jobs:
  auto-merge:
    name: Apply dependency policy
    uses: nicodes/tools/.github/workflows/dependency-merge.yml@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
