name: Dependency Policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '1 6 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
concurrency:
  group: dependency-policy
  cancel-in-progress: false
jobs:
  auto-merge:
    if: >-
      (github.event_name != 'workflow_run' && github.event_name != 'pull_request_target') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.actor.login == 'dependabot[bot]' || startsWith(github.event.workflow_run.head_branch, 'dependabot/') || startsWith(github.event.workflow_run.head_branch, 'dependabot-')))
    name: Apply dependency policy
    uses: nicodes/tools/.github/workflows/dependency-merge.yml@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
    with:
      runner: ubuntu-24.04
