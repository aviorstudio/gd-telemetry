# Generated cookbook caller. Change recipe data and regenerate.
name: Build and test
run-name: "Build and test · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || inputs.source || github.ref_name }}"
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      cookbook:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      COOKBOOK_VALIDATION_TIMEOUT: '30'
      COOKBOOK_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || inputs.source || github.sha }}
    steps:
      - name: Prepare
        timeout-minutes: 20
        uses: nicodes/cookbook/prepare@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
        with:
          cookbook-ref: ${{ inputs.cookbook || '2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854' }}
          source: ${{ inputs.source || github.sha }}
      - name: Build
        timeout-minutes: 30
        uses: nicodes/cookbook/build@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
      - name: Test
        timeout-minutes: 30
        uses: nicodes/cookbook/test@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
      - name: Finish
        if: always()
        timeout-minutes: 5
        uses: nicodes/cookbook/finish@2cdbf56cda3ed37d78be1b4e58cfe7ffcb943854
        with:
          status: ${{ job.status }}
