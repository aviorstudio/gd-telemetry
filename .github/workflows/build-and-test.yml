# Generated cookbook caller. Change recipe data and regenerate.
name: Build and test
run-name: "Build and test · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || inputs.source || github.ref_name }}"
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      cookbook:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  validate:
    name: Test
    uses: nicodes/cookbook/.github/workflows/build-and-test-host.yml@91eb552cd44e876a66bbc519ef81f36a3789f397
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      cookbook-ref: ${{ inputs.cookbook || '91eb552cd44e876a66bbc519ef81f36a3789f397' }}
      source: ${{ inputs.source || github.sha }}
      mode: full
      runner: ubuntu-24.04
      timeout-minutes: 30
  build-test:
    name: Build and test
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the complete current source validation
        timeout-minutes: 1
        uses: nicodes/cookbook/ci-result@91eb552cd44e876a66bbc519ef81f36a3789f397
        with:
          event-name: ${{ github.event_name }}
          needs: ${{ toJSON(needs) }}
