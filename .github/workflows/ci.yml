# Generated cookbook caller. Change recipe data and regenerate.
name: Build & Test
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      tools:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  validate:
    uses: nicodes/tools/.github/workflows/cookbook-ci.yml@ade449c3150fd5a9c86fb6ec21d8ae905d6a2754
    permissions:
      contents: read
    with:
      tools-ref: ${{ inputs.tools || 'ade449c3150fd5a9c86fb6ec21d8ae905d6a2754' }}
      source: ${{ inputs.source || github.sha }}
      merge-gate: ${{ vars.COOKBOOK_REQUEST_MERGE == 'enabled' }}
      runner: ubuntu-24.04
      timeout-minutes: 30
