name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  attestations: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up locked Komizo
      uses: nicodes/komizo/setup@f7b2d96c5456827633e0a4adce67f8604bbdd193
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        komizo exec --tools python -- bash -euo pipefail <<'KOMIZO_COMMAND'
        python3 "$CICD_ENGINEERING/helpers/integration-identity.py"
        KOMIZO_COMMAND
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Check project
      uses: nicodes/komizo/run@f7b2d96c5456827633e0a4adce67f8604bbdd193
      with:
        target: check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
