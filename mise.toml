[tools]
python = "3.13.11"
actionlint = "1.7.12"
"pipx:gdtoolkit" = "4.5.0"

[env]
GODOT_VERSION = "4.7.2"
GODOT_EXPECTED_VERSION = "4.7.2.stable.official.ed1daf0bf"
GODOT_BINARY_CHECKSUM = "sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
GODOT_TEMPLATES_CHECKSUM = "sha256:f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"
PYTHONDONTWRITEBYTECODE = "1"

# BEGIN GENERATED COOKBOOK TASKS v1
[settings]
task.run_auto_install = false

[vars]
cookbook_contract = 1
cookbook_ref = "52d8ab977e6bde843555408437be6e0f22834fe3"
cookbook_recipe = "godot-addon"
cookbook_sha256 = "b8b847efd04c954acaff8fd9eb533135c6dc2a9f774708e6ebaebf50c3356acd"

[tasks._sdk]
hide = true
shell = "bash -euc"
cache = { enabled = false }
run = "exec env MISE_AUTO_INSTALL=false MISE_EXEC_AUTO_INSTALL=false MISE_TASK_RUN_AUTO_INSTALL=false \"${COOKBOOK_BOOTSTRAP_PYTHON:-python3}\" -I -B -c 'import base64,hashlib,sys,zlib;_sdk_decoder=zlib.decompressobj();_sdk_seed=_sdk_decoder.decompress(base64.b64decode(\"\",validate=True),10868);(_sdk_decoder.eof and not _sdk_decoder.unused_data and not _sdk_decoder.unconsumed_tail and len(_sdk_seed)==10867 and hashlib.sha256(_sdk_seed).hexdigest()==\"f41788a46dc04e965285e7945b6497c688537372738ab6bf425f6ef4aa0d3a3b\") or sys.exit(\"SDK bootstrap seed failed integrity validation\");exec(compile(_sdk_seed,\"<immutable SDK bootstrap>\",\"exec\"))' 52d8ab977e6bde843555408437be6e0f22834fe3"

[tasks."help"]
description = "List implemented commands"
cache = { enabled = false }
shell = "bash -euc"
run = "printf '%s\\n' 'mise run help              List implemented commands\nmise run setup             Prepare pinned tools and dependencies\nmise run fmt               Apply formatting\nmise run build             Compile, package and validate outputs\nmise run test              Run implemented test groups without building\nmise run test:lint         Check formatting, code and configuration\nmise run test:unit         Run isolated behavior tests\nmise run test:security     Run applicable security checks\nmise run test:integration  Test real component boundaries\nmise run clean             Remove declared outputs; preserve retained data'"

[tasks."setup"]
description = "Prepare pinned tools and dependencies"
cache = { enabled = false }
shell = "bash -euc"
run = ["mise install python", { task = "_sdk", args = ["setup", "cookbook/dispatch.py", "setup"] }]

